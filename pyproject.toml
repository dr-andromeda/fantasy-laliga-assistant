[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-laliga-assistant"
version = "0.1.0"
description = "Decision-support tool for LaLiga Fantasy: value your squad and get transfer, lineup and captain recommendations, backed by a walk-forward backtest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baltasar Hurtado Jiménez", email = "baltahurtado16@gmail.com" }]
keywords = ["laliga", "fantasy-football", "optimization", "sports-analytics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6",
    "rapidfuzz>=3.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "mypy>=1.9", "types-PyYAML"]
scrape = ["beautifulsoup4>=4.12"]  # only for scripts/fetch_squads.py --source transfermarkt
solver = ["qubo-forge @ git+https://github.com/dr-andromeda/qubo-forge.git"]  # fla squad qubo-transfers

[project.scripts]
fla = "fantasy_assistant.cli:app"

[project.urls]
Homepage = "https://github.com/dr-andromeda/fantasy-laliga-assistant"
Repository = "https://github.com/dr-andromeda/fantasy-laliga-assistant"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"src/fantasy_assistant/config" = "fantasy_assistant/config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["fantasy_assistant"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["qubo_forge.*"]
ignore_missing_imports = true
